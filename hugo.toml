baseURL = "https://sovereign-tech-directory.eu/"
title = "Sovereign Tech Directory"
defaultContentLanguage = "en"
enableRobotsTXT = true

[languages]
  [languages.en]
    languageCode = "en-GB"
    languageName = "English"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "A curated directory for digital sovereignty in Europe"
  [languages.de]
    languageCode = "de-DE"
    languageName = "Deutsch"
    weight = 2
    contentDir = "content/de"
    [languages.de.params]
      description = "Ein kuratiertes Verzeichnis für digitale Souveränität in Europa"

[taxonomies]
  category = "categories"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params]
  ogImage = "/images/social/og-default.png"
  ogImageAlt = "Sovereign Tech Directory"

[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true

[outputs]
  home = ["HTML", "searchindex"]

[module]
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-heroicons"
